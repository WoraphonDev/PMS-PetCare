name: ci
on:
  pull_request:
  push:
    branches: [main]
  # update-branch.yml merges main into approved PRs with GITHUB_TOKEN, which does not trigger pull_request runs —
  # it dispatches this workflow on the PR branch instead, so the required `verify` check runs on the new head.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: task scope (task branches t-NNNN-*)
        if: github.event_name != 'push'
        run: node scripts/check-task-scope.mjs
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
      - name: guard script tests
        run: pnpm test:scripts
      - name: questions format (docs/questions/*.md)
        run: node scripts/questions-index.mjs --check
      - name: registry files sorted, one entry per line
        run: node scripts/check-registries.mjs
      - name: pnpm verify
        run: pnpm verify
      - name: no skipped/focused tests added
        if: github.event_name != 'push'
        run: |
          if git diff origin/${{ github.base_ref || 'main' }}...HEAD -U0 -- '*.test.ts' '*.test.tsx' '*.spec.ts' '*.e2e.ts' | grep -E '^\+.*\b(it|test|describe)\.(skip|only|todo)\(' ; then
            echo "::error::.skip/.only/.todo added — not allowed (AGENTS.md rule 4)"; exit 1; fi
