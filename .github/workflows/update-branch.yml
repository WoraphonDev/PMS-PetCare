# Keep approved PRs up to date with main (process-fixes 7e). Branch protection requires up-to-date branches
# (`strict`), so an `agent-approved` PR would wait forever after main moves. When main moves, merge main into each
# approved PR (GitHub "Update branch", a merge — never a rebase) and re-run CI on it. A conflict cannot be solved
# here: the label is removed and the author agent runs scripts/sync-main.sh.
# The merge commit is made with GITHUB_TOKEN: it does not trigger pull_request workflows, so it neither re-runs CI
# by itself nor drops the label via auto-merge.yml `reset-on-push` (merging main is not new reviewed content).
name: update-branch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: update-branch
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Update approved PRs that are behind main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh pr list -R "$REPO" --base main --label agent-approved --state open --json number,headRefName \
            --jq '.[] | "\(.number) \(.headRefName)"' | while read -r pr ref; do
            state=$(gh pr view "$pr" -R "$REPO" --json mergeStateStatus --jq .mergeStateStatus)
            echo "PR #$pr ($ref): $state"
            [ "$state" = "BEHIND" ] || continue
            if gh pr update-branch "$pr" -R "$REPO"; then
              gh workflow run ci.yml -R "$REPO" --ref "$ref"
              echo "::notice::PR #$pr updated with main; CI dispatched on $ref"
            else
              gh pr edit "$pr" -R "$REPO" --remove-label agent-approved
              gh pr merge "$pr" -R "$REPO" --disable-auto || true
              gh pr comment "$pr" -R "$REPO" --body "main moved and this branch no longer merges cleanly — \`agent-approved\` removed. Author agent: run \`scripts/sync-main.sh\`, then re-run the review loop and re-apply the label."
            fi
          done
