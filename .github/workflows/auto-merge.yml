# approval-proof must be required alongside verify in main branch protection.
# It is head-specific: a writer's new push cannot auto-merge while a queued reset is still waiting.
name: auto-merge
on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  approval-proof:
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
    steps:
      # Never execute the task PR's code with the write token. Only trusted base scripts and git objects.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify task from the trusted base card
        id: eligibility
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo 'eligible=false' >> "$GITHUB_OUTPUT"
          [ "$HEAD_REPO" = "$BASE_REPO" ] && [ "$BASE_REF" = main ] || exit 0
          [[ "$HEAD_REF" =~ ^t-([0-9]{4})- ]] || exit 0
          card="docs/tasks/T-${BASH_REMATCH[1]}.md"
          [ -f "$card" ] || { echo 'Missing task card on main'; exit 1; }
          front=$(awk 'NR==1 && /^---$/ {f=1; next} f && /^---$/ {exit} f' "$card")
          echo "$front" | grep -qE '^owner: agent$' || exit 0
          echo "$front" | grep -qE '^human_review: false$' || exit 0
          echo 'eligible=true' >> "$GITHUB_OUTPUT"
      - name: Prove approval for this exact head
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: bash scripts/check-approval-proof.sh

  reset-on-push:
    needs: approval-proof
    if: always() && needs.approval-proof.outputs.eligible == 'true' && needs.approval-proof.result != 'success' && contains(github.event.pull_request.labels.*.name, 'agent-approved')
    runs-on: ubuntu-24.04
    steps:
      - name: Proof failed — remove stale approval and cancel auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr edit "$PR" -R "$REPO" --remove-label agent-approved
          gh pr merge "$PR" -R "$REPO" --disable-auto || true
          gh pr comment "$PR" -R "$REPO" --body "Head-specific approval proof failed. Review this head and re-apply agent-approved. Required approval-proof blocks merge even before this cleanup runs."

  enable:
    needs: approval-proof
    if: needs.approval-proof.outputs.eligible == 'true' && github.event.action == 'labeled' && github.event.label.name == 'agent-approved'
    runs-on: ubuntu-24.04
    steps:
      - name: Enable auto-merge pinned to approved head (waits for required checks)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          APPROVED: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR" -R "$REPO" --auto --squash --delete-branch --match-head-commit "$APPROVED"
